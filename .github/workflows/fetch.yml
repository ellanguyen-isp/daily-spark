name: Fetch sources

# Collects new items from every source in config/sources.yaml
# and saves them to data/candidates/<date>.json for the morning Worker.
on:
  schedule:
    - cron: "40 22 * * *"   # 05:40 Vietnam time (UTC+7)
  workflow_dispatch:
    inputs:
      days:
        description: "Look-back window in days"
        default: "3"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Fetch
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/fetch.py --days "${{ github.event.inputs.days || '3' }}"
      - name: Save candidates
        run: |
          git config user.name "daily-spark-bot"
          git config user.email "daily-spark-bot@users.noreply.github.com"
          git add data/candidates
          git diff --cached --quiet || git commit -m "fetch: candidates for $(TZ=Asia/Ho_Chi_Minh date +%F)"
          git push
