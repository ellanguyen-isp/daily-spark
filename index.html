<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8d9ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* daily spark site. Design system "daily spark" v1 (approved 2026-11-01, see ARCHITECTURE.md 3.9).
   Two themes chosen by the reader in Menu > Appearance (Auto / Light / Dark). Every color, size,
   space and radius below comes from the design system tokens; do not add one-off values. */
:root, .t-light {
  --bg-page: #e8d9ed; --bg-card: #f7f4ed; --bg-card-alt: #e9f3ff; --bg-card-past: #f6f0f9;
  --ink: #0b1957; --ink-muted: #5a5683; --accent: #426bc2; --on-accent: #f7f4ed; --line: rgba(11,25,87,.14);
  --nav: rgba(232,217,237,.84); --scrim: rgba(11,25,87,.32);
  --shadow-raised: 0 10px 24px rgba(11,25,87,.12); --shadow-overlay: 0 20px 40px -20px rgba(11,25,87,.35);
  color-scheme: light;
}
.t-dark {
  --bg-page: #0b1957; --bg-card: #17286f; --bg-card-alt: #1b2f7c; --bg-card-past: #17286f;
  --ink: #f7f4ed; --ink-muted: #b9bde3; --accent: #c7a9e3; --on-accent: #0b1957; --line: rgba(247,244,237,.16);
  --nav: rgba(11,25,87,.86); --scrim: rgba(4,10,40,.5);
  --shadow-raised: 0 10px 24px rgba(0,0,0,.25); --shadow-overlay: 0 20px 60px rgba(0,0,0,.4);
  color-scheme: dark;
}
:root {
  --m-ready: #c7f0d8; --m-emerging: #f6e6b4; --m-early: #f6c9c9; --ink-on-signal: #0b1957;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --r-sm: 4px; --r-md: 12px; --r-lg: 20px; --r-pill: 999px;
  --display: "Instrument Serif", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg-page); color: var(--ink); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.device { position: relative; height: 100%; overflow: hidden; background: var(--bg-page); }
.ds { position: relative; height: 100%; display: flex; flex-direction: column; background: var(--bg-page); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 22px; font-variant-numeric: lining-nums tabular-nums; -webkit-font-smoothing: antialiased; }

/* type: 11 label / 13 small / 15 body / 21 h3 / 30 h2 / 44 hero; weights 400 and 600 */
.lbl { font-size: 11px; line-height: 14px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--ink-muted); }
.small { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.num { font-variant-numeric: lining-nums tabular-nums; }

/* icons */
.ic, .iconbtn svg, .fb svg, .fbkey svg, .tabbar svg.ln { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* translucent bars */
.bar { position: absolute; left: 0; right: 0; z-index: 5; background: var(--nav); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.bar.top { top: 0; box-shadow: inset 0 -1px 0 var(--line); padding-top: env(safe-area-inset-top); }
.bar.bottom { bottom: 0; box-shadow: inset 0 1px 0 var(--line); padding-bottom: env(safe-area-inset-bottom); }
.topin { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-height: 60px; padding: 0 var(--s2); max-width: 1184px; margin: 0 auto; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s1); min-width: 44px; height: 44px; padding: 0 var(--s3); border: 0; border-radius: var(--r-pill); background: transparent; color: var(--ink); cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; }
.iconbtn:hover, .iconbtn[aria-expanded="true"] { background: var(--bg-card); }
.titlebtn { display: inline-flex; align-items: center; gap: var(--s1); min-height: 44px; padding: 0 var(--s3); border: 0; border-radius: var(--r-pill); background: transparent; color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; }
.titlebtn .ic { width: 16px; height: 16px; }
.tabs { display: inline-flex; gap: var(--s1); }
.tabs a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--s4); border-radius: var(--r-pill); font-size: 13px; font-weight: 600; color: var(--ink-muted); text-decoration: none; }
.tabs a[aria-current="page"] { background: var(--bg-card); color: var(--ink); }
.brandmk { display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center; color: var(--ink); }
.brandmk svg { width: 28px; height: 28px; }
/* phone: Sparks / Radar tabs at the bottom of the two top-level screens */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: var(--s1) var(--s4) calc(var(--s2) + env(safe-area-inset-bottom)); background: var(--nav); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 var(--line); }
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); text-decoration: none; }
.tabbar a[aria-current="page"] { color: var(--ink); }
.tabbar a[aria-current="page"] svg { color: var(--accent); }
.tabbar svg { width: 22px; height: 22px; }
.device.web .tabbar { display: none; }

/* menu: bottom sheet on phone, popover on web */
.scrim { position: absolute; inset: 0; z-index: 6; background: var(--scrim); border: 0; padding: 0; cursor: pointer; }
.sheet { position: absolute; z-index: 7; left: 0; right: 0; bottom: 0; max-height: calc(100% - 72px); overflow-y: auto; background: var(--bg-card); border-radius: var(--r-lg) var(--r-lg) 0 0; box-shadow: var(--shadow-overlay); padding: var(--s3) var(--s5) calc(var(--s6) + env(safe-area-inset-bottom)); display: grid; gap: var(--s5); }
.sheet::before { content: ""; justify-self: center; width: 40px; height: 4px; border-radius: var(--r-pill); background: var(--line); }
.device.web .sheet { left: auto; bottom: auto; right: max(var(--s4), calc((100% - 1184px) / 2 + var(--s2))); top: calc(64px + env(safe-area-inset-top)); width: 360px; max-height: calc(100% - 88px); border-radius: var(--r-lg); padding: var(--s5); }
.device.web .sheet::before { display: none; }
.device.web .scrim { background: transparent; }
.sheet .row { display: grid; gap: var(--s2); }
.sheet .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); }
.seg2 { display: inline-flex; gap: var(--s1); padding: var(--s1); border-radius: var(--r-pill); background: var(--bg-card-alt); width: fit-content; }
.seg2.full { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
.seg2 button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 var(--s4); border: 0; border-radius: var(--r-pill); background: transparent; color: var(--ink-muted); font-size: 13px; font-weight: 600; cursor: pointer; }
.seg2 button[aria-pressed="true"] { background: var(--ink); color: var(--bg-card); }
.seg2 .ic { width: 16px; height: 16px; }
.datelist { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); max-height: 232px; overflow-y: auto; }
.datelist button { width: 100%; min-height: 48px; text-align: left; border: 0; background: var(--bg-card-past); color: var(--ink); border-radius: var(--r-md); padding: var(--s2) var(--s3); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: var(--s2); font-size: 13px; }
.t-dark .datelist button { background: var(--bg-card-alt); }
.datelist button[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--accent); font-weight: 600; }
.wtag { display: inline-flex; align-items: center; height: 20px; padding: 0 var(--s2); margin-right: var(--s2); border-radius: var(--r-pill); background: var(--accent); color: var(--on-accent); font-size: 11px; line-height: 14px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; vertical-align: 1px; }
.fbkey { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2) var(--s4); font-size: 13px; }
.fbkey span { display: inline-flex; align-items: center; gap: var(--s2); }
.field { width: 100%; min-width: 0; min-height: 44px; padding: 0 var(--s4); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--bg-page); color: var(--ink); }
.t-light .field { background: #ffffff; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 44px; padding: 0 var(--s5); border: 0; border-radius: var(--r-pill); background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; justify-self: start; }
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.sm { min-height: 40px; padding: 0 var(--s4); font-size: 13px; }

/* home (Sparks tab) */
.shome { flex: 1; overflow-y: auto; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
.device.web .shome { padding-bottom: var(--s7); }
.scont { width: min(1120px, 100% - 32px); margin: 0 auto; }
.device.web .scont { width: min(1120px, 100% - 64px); }
.snav { position: sticky; top: 0; z-index: 4; background: var(--nav); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); padding-top: env(safe-area-inset-top); }
.snav .scont { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); min-height: 60px; }
.snav .right { display: flex; align-items: center; gap: var(--s2); }
.sgreet { padding: var(--s5) 0 var(--s6); display: grid; gap: var(--s2); max-width: 720px; }
.sgreet h1 { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 48px; text-wrap: balance; }
.sgreet p { color: var(--ink-muted); }
.sgrid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--s6); align-items: start; }
@media (max-width: 760px) { .sgrid { grid-template-columns: minmax(0, 1fr); gap: var(--s6); } }
.srows { display: grid; gap: var(--s3); }
.srow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--s3); min-height: 56px; padding: var(--s3) var(--s4); border-radius: var(--r-md); background: var(--bg-card-past); color: var(--ink); text-decoration: none; }
.srow:hover { box-shadow: inset 0 0 0 1px var(--accent); }
.srow .sd { font-size: 13px; color: var(--ink-muted); white-space: nowrap; }
.srow .st { font-family: var(--display); font-size: 21px; line-height: 26px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .st .wtag { font-family: var(--body); }
.srow .se { font-size: 13px; color: var(--ink-muted); white-space: nowrap; }
.sempty { margin: 0; padding: var(--s4); border: 1px dashed var(--line); border-radius: var(--r-md); color: var(--ink-muted); font-size: 13px; }
.swk { display: grid; gap: var(--s1); padding: var(--s4); border-radius: var(--r-md); background: var(--bg-card-alt); color: var(--ink); text-decoration: none; }
.swk:hover { box-shadow: inset 0 0 0 1px var(--accent); }
.swk .st { font-family: var(--display); font-size: 21px; line-height: 26px; }
.swk .se { font-size: 13px; color: var(--ink-muted); }

/* stamp: the signature. Perforated edge cut from the card so the page shows through. */
.stamp { --c: var(--bg-card); position: relative; padding: 6px; background: radial-gradient(circle at center, transparent 4px, var(--c) 4.5px) -6px -6px / 12px 12px round; color: var(--ink); }
.stamp > .in { background: var(--c); padding: 10px; display: grid; gap: var(--s3); align-content: start; min-width: 0; }
.mtoday { display: block; text-decoration: none; }
.mtoday > .in { gap: var(--s4); padding: var(--s3); }
.mtoday .pills { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--s2); border-radius: var(--r-pill); background: var(--bg-card-alt); color: var(--ink); font-size: 11px; line-height: 14px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; white-space: nowrap; }
.chip.accent { background: var(--accent); color: var(--on-accent); }
.mtoday h2 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 34px; text-wrap: balance; }
.mtoday ul { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.mtoday li { display: flex; justify-content: space-between; gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 18px; font-weight: 600; }
.mtoday li span:last-child { color: var(--ink-muted); font-weight: 400; white-space: nowrap; }
.mtoday .btn { justify-self: start; }

/* edition pages */
.home { flex: 1; overflow-y: auto; padding: calc(84px + env(safe-area-inset-top)) var(--s4) var(--s6); }
.detail { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.track { flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; min-height: 0; }
.track::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; min-width: 0; scroll-snap-align: center; padding: calc(84px + env(safe-area-inset-top)) var(--s4) calc(96px + env(safe-area-inset-bottom)); overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
.slide > .card { width: min(720px, 100%); }
.flow { flex: 1; overflow-y: auto; padding: calc(84px + env(safe-area-inset-top)) var(--s4) var(--s7); display: grid; gap: var(--s7); align-content: start; justify-items: center; }
.flow > .card { width: min(720px, 100%); }
.dots { display: flex; justify-content: center; align-items: center; gap: var(--s2); min-height: 68px; }
.dots .dot { width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--line); border: 0; padding: 0; cursor: pointer; }
.dots .dot[aria-current="true"] { background: var(--ink); width: 24px; }
.dots .nav { width: 44px; height: 44px; border: 0; border-radius: var(--r-pill); background: transparent; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.dots .nav:hover { background: var(--bg-card); }

/* a section = title on the page + one stamp per point; sections alternate card colors */
.card { --c: var(--bg-card); display: grid; gap: var(--s4); align-content: start; }
.card.alt { --c: var(--bg-card-alt); }
.kicker { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); margin-bottom: var(--s2); }
.card h2 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 34px; text-wrap: balance; }
.card h3 { font-family: var(--display); font-weight: 400; font-size: 21px; line-height: 26px; text-wrap: balance; }
.items { display: grid; gap: var(--s4); }
.item { --c: inherit; position: relative; padding: 6px; background: radial-gradient(circle at center, transparent 4px, var(--c) 4.5px) -6px -6px / 12px 12px round; color: var(--ink); text-decoration: none; display: block; }
.item > .in { background: var(--c); padding: 10px; display: grid; gap: var(--s3); align-content: start; min-width: 0; }
.block { display: grid; gap: var(--s1); }
.srcline { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); align-items: center; font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.srcline a { color: var(--accent); text-decoration: none; font-weight: 600; }
.srcline a:hover { text-decoration: underline; }
.badge { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--s2); border-radius: var(--r-pill); background: var(--bg-card-alt); color: var(--ink); font-size: 11px; line-height: 14px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; margin-left: auto; }
.card.alt .badge { background: var(--bg-card); }
.pts { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s2); }
.pts li { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: var(--s2); }
.pts li::before { content: ""; width: 6px; height: 6px; margin-top: 8px; border-radius: var(--r-pill); background: var(--accent); }
.why { padding: var(--s3); border-radius: var(--r-sm); background: var(--bg-card-alt); }
.card.alt .why { background: var(--bg-card); }
.stat { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
.stat .v { font-weight: 600; font-size: 30px; line-height: 34px; color: var(--accent); }
.stat .l { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.fb { display: flex; gap: var(--s1); align-items: center; padding-top: var(--s3); border-top: 1px solid var(--line); }
.fb button { width: 44px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: var(--r-pill); padding: 0; cursor: pointer; color: var(--ink-muted); }
.fb button:hover { color: var(--ink); background: var(--bg-card-alt); }
.card.alt .fb button:hover { background: var(--bg-card); }
.fb button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.fb .notebtn { width: auto; gap: var(--s1); padding: 0 var(--s3); margin-left: auto; font-size: 13px; font-weight: 600; }
.notebox { display: grid; gap: var(--s2); }
.notebox textarea { width: 100%; min-height: 44px; resize: none; overflow: hidden; line-height: 18px; border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s3) var(--s4); background: var(--bg-page); color: var(--ink); font-size: 13px; }
.t-light .notebox textarea, .t-light .answer { background: #ffffff; }
.notebox .row2 { display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; }
.save { min-height: 40px; padding: 0 var(--s4); border: 0; border-radius: var(--r-pill); background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 600; cursor: pointer; justify-self: start; }
.lock { display: inline-flex; gap: var(--s2); align-items: center; height: 24px; font-size: 13px; border: 1px dashed var(--ink-muted); border-radius: var(--r-pill); padding: 0 var(--s3); color: var(--ink-muted); width: fit-content; }
.quote { font-family: var(--display); font-style: italic; font-size: 21px; line-height: 26px; text-wrap: balance; }
.qs { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s4); }
.qs .in { grid-template-columns: 24px minmax(0, 1fr); gap: var(--s2); }
.qs .qn { font-size: 13px; font-weight: 600; color: var(--accent); padding-top: 2px; }
.qs .qt { min-width: 0; font-family: var(--display); font-size: 21px; line-height: 26px; }
.qs .ctx { display: block; margin-top: var(--s2); font-family: var(--body); font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.answer { width: 100%; min-height: 88px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bg-page); padding: var(--s3) var(--s4); resize: vertical; color: var(--ink); }
.ex-opt .goal { font-family: var(--display); font-size: 21px; line-height: 26px; }
.ex-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); }
.ex-opt ol { margin: 0; padding-left: 20px; display: grid; gap: var(--s1); font-size: 13px; line-height: 18px; }
.ex-opt button { min-height: 36px; border: 0; box-shadow: inset 0 0 0 1px var(--accent); background: transparent; color: var(--ink); border-radius: var(--r-pill); padding: 0 var(--s4); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.ex-opt button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.item.picked { --c: var(--accent); }
.item.picked > .in, .item.picked .lbl, .item.picked .small { color: var(--on-accent); }
.item.picked .ex-opt button, .item.picked button[aria-pressed="true"] { background: var(--on-accent); color: var(--accent); }
.pills2 { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--s2); border-radius: var(--r-pill); font-size: 11px; line-height: 14px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; background: var(--bg-card-alt); color: var(--ink); }
.pill.mega, .pill.ready { background: var(--m-ready); color: var(--ink-on-signal); }

        '</span><span class="se num">' + esc(d.edition) + '</span></a>';
    }).join("") : '<p class="sempty">' + esc(state.loaded ? u("earlier") : u("loading")) + '</p>';
    return '<div class="shome"><header class="snav"><div class="scont"><a class="brandmk" href="#" aria-label="daily spark">' + MARK + '</a>' +
      '<div class="right">' + webTabs("sparks") + menuBtn() + '</div></div></header>' +
      '<main class="scont"><section class="sgreet"><p class="lbl">' + esc((OWNER ? u("hi") + " " + OWNER + " · " : "") + longDate(todayVN())) + '</p><h1>' + esc(greet) + '</h1><p>' + esc(u("tagline")) + '</p></section>' +
      '<div class="sgrid"><section style="display:grid;gap:var(--s4)"><span class="lbl">' + esc(fresh || !d0 ? u("today") : u("latest")) + '</span>' + today + '</section>' +
      '<section class="srows">' + week + '<span class="lbl">' + esc(u("previous")) + '</span>' + rows + '</section></div></main></div>' + tabBar("sparks") + sheetHTML();
  }
  function dayNav() {
    var web = isWeb(), w = state.ed && state.ed.type === "weekly";
    var top = '<div class="bar top"><div class="topin">' +
      '<a class="iconbtn" href="#" aria-label="' + esc(u("allsparks")) + '">' + IC.back + (web ? '<span>' + esc(u("allsparks")) + '</span>' : "") + '</a>' +
      '<button type="button" class="titlebtn" data-menu="1" aria-expanded="' + state.menu + '">' + (w ? '<span class="wtag">' + esc(u("weekly")) + '</span>' : "") + '<span class="num">' + esc(web ? longDate(state.cur) : shortDate(state.cur)) + '</span>' + IC.down + '</button>' +
      menuBtn() + '</div></div>';
    return top + sheetHTML();
  }
  function segBtn(set, v, label, icon) {
    return '<button type="button" data-set="' + set + '" data-v="' + v + '" aria-pressed="' + (state[set] === v) + '">' + (icon || "") + esc(label) + '</button>';
  }
  function sheetHTML() {
    if (!state.menu) return "";
    var langs = (SITE.languages || ["en", "vi"]).length > 1;
    return '<button type="button" class="scrim" data-menu="1" aria-label="' + esc(u("close")) + '"></button><div class="sheet" role="dialog" aria-label="' + esc(u("menu")) + '">' +
      '<div class="row"><span class="lbl">' + esc(u("appearance")) + '</span><div class="seg2 full" role="group" aria-label="' + esc(u("appearance")) + '">' +
      segBtn("theme", "auto", u("auto"), IC.auto) + segBtn("theme", "light", u("light"), IC.light) + segBtn("theme", "dark", u("dark"), IC.dark) + '</div></div>' +
      '<div class="pair">' + (state.cur && state.cur !== "radar" ? '<div class="row"><span class="lbl">' + esc(u("reading")) + '</span><div class="seg2" role="group" aria-label="' + esc(u("reading")) + '">' + segBtn("view", "swipe", u("swipe")) + segBtn("view", "scroll", u("scroll")) + '</div></div>' : "") +
      (langs ? '<div class="row"><span class="lbl">' + esc(u("language")) + '</span><div class="seg2" role="group" aria-label="' + esc(u("language")) + '">' + segBtn("lang", "en", "EN") + segBtn("lang", "vi", "VI") + '</div></div>' : "") + '</div>' +
      '<div class="row"><span class="lbl">' + esc(u("fbtitle")) + '</span>' + fbKey() + '</div>' +
      '<div class="row"><label class="lbl" for="wk">' + esc(u("device")) + '</label>' +
      (wkey() ? '<span class="small">' + esc(u("connected")) + '</span><button type="button" class="btn ghost sm" id="disc">' + esc(u("disconnect")) + '</button>' :
        '<div style="display:flex;gap:var(--s2)"><input class="field" id="wk" type="password" autocomplete="off" placeholder="' + esc(u("keyPh")) + '"><button type="button" class="btn sm" id="conn">' + esc(u("connect")) + '</button></div><span class="small">' + esc(u("notConnected")) + '</span>') + '</div>' +
      '<div class="row"><span class="lbl">' + esc(u("otherdays")) + '</span><ul class="datelist">' + state.days.map(function (d) {
        return '<li><button type="button" data-go-day="' + d.date + '" aria-current="' + (d.date === state.cur) + '"><span class="num">' + esc(longDate(d.date)) + '</span><span class="small num">' + (d.type === "weekly" ? '<span class="wtag">' + esc(u("weekly")) + '</span>' : esc(u("edition")) + ' ') + esc(d.edition) + '</span></button></li>';
      }).join("") + '</ul></div></div>';
  }
  function dayHTML() {
    var E = state.ed;
    if (!E) return dayNav() + '<div class="home"><p>' + esc(state.err ? u("missing") : u("loading")) + '</p></div>';
    var secs = E.type === "weekly" ? WSECTIONS.filter(function (s) { return !!E[s]; }) : SECTIONS.filter(function (s) { return s === "work" ? E.work && E.work.length : !!E[s]; });
    if (state.slide >= secs.length) state.slide = 0;
    var reading;
    if (state.view === "swipe") {
      reading = '<div class="track" id="track">' + secs.map(function (s, i) { return '<div class="slide">' + sectionHTML(E, s, i, secs.length) + '</div>'; }).join("") + '</div>' +
        '<div class="bar bottom"><nav class="dots" aria-label="Sections"><button type="button" class="nav" id="prev" aria-label="' + esc(u("prev")) + '">' + IC.prev + '</button>' +
        secs.map(function (s, i) { return '<button type="button" class="dot" data-go="' + i + '" aria-label="' + esc(u("s_" + s)) + '" aria-current="' + (i === state.slide) + '"></button>'; }).join("") +
        '<button type="button" class="nav" id="next" aria-label="' + esc(u("next")) + '">' + IC.next + '</button></nav></div>';
    } else {
      reading = '<div class="flow" id="flow">' + secs.map(function (s, i) { return sectionHTML(E, s, i, secs.length); }).join("") + '</div>';
    }
    state.secs = secs;
    return '<div class="detail">' + reading + '</div>' + dayNav();
  }

  function render() {
    var rf = document.getElementById("rflow"), rkeep = rf && state.cur === "radar" ? rf.scrollTop : 0;
    var fl = document.getElementById("flow"), fkeep = fl ? fl.scrollTop : 0, keepCur = state.cur;
    var skeep = Array.prototype.map.call(dev.querySelectorAll(".slide"), function (x) { return x.scrollTop; });
    applyTheme();
    dev.className = "device" + (isWeb() ? " web" : "");
    document.documentElement.lang = state.lang;
    dev.innerHTML = '<div class="ds">' + (state.cur === "radar" ? radarHTML() : state.cur ? dayHTML() : homeHTML()) + '</div>';
    document.title = state.cur === "radar" ? "daily spark · radar" : state.cur ? "daily spark · " + shortDate(state.cur) : "daily spark";
    if (rkeep) { var rf2 = document.getElementById("rflow"); if (rf2) rf2.scrollTop = rkeep; }
    if (keepCur === state.cur) {
      var fl2 = document.getElementById("flow"); if (fl2 && fkeep) fl2.scrollTop = fkeep;
      dev.querySelectorAll(".slide").forEach(function (x, i) { if (skeep[i]) x.scrollTop = skeep[i]; });
    }
    wire();
  }

  function wire() {
    var track = document.getElementById("track"), secs = state.secs || [];
    function mark(i) { dev.querySelectorAll(".dot").forEach(function (d, j) { d.setAttribute("aria-current", String(j === i)); }); }
    function go(i) { i = Math.max(0, Math.min(secs.length - 1, i)); if (track) track.scrollTo({ left: track.clientWidth * i }); }
    if (track) {
      requestAnimationFrame(function () { track.scrollLeft = track.clientWidth * state.slide; });
      var tmr;
      track.addEventListener("scroll", function () {
        clearTimeout(tmr);
        tmr = setTimeout(function () { var i = Math.round(track.scrollLeft / track.clientWidth); if (i !== state.slide) { state.slide = i; mark(i); } }, 80);
      });
      document.getElementById("prev").addEventListener("click", function () { go(state.slide - 1); });
      document.getElementById("next").addEventListener("click", function () { go(state.slide + 1); });
      dev.querySelectorAll(".dot").forEach(function (d) { d.addEventListener("click", function () { go(+d.dataset.go); }); });
      var down = false, sx = 0, sl = 0;
      track.addEventListener("pointerdown", function (e) {
        if (e.pointerType !== "mouse" || e.target.closest("button, textarea, a")) return;
        down = true; sx = e.clientX; sl = track.scrollLeft; track.style.scrollSnapType = "none";
      });
      window.onpointermove = function (e) { if (down) track.scrollLeft = sl - (e.clientX - sx); };
      window.onpointerup = function () { if (!down) return; down = false; track.style.scrollSnapType = ""; go(Math.round(track.scrollLeft / track.clientWidth)); };
    }
    dev.querySelectorAll("[data-set]").forEach(function (b) { b.addEventListener("click", function () {
      state[b.dataset.set] = b.dataset.v; save(b.dataset.set, b.dataset.v); if (b.dataset.set === "view") state.slide = 0; render(); }); });
    dev.querySelectorAll("[data-menu]").forEach(function (b) { b.addEventListener("click", function () { state.menu = !state.menu; render(); }); });
    dev.querySelectorAll("[data-go-day]").forEach(function (b) { b.addEventListener("click", function () { location.hash = b.dataset.goDay; }); });
    dev.querySelectorAll("[data-pick]").forEach(function (b) { b.addEventListener("click", function () {
      state.picked[state.cur] = state.picked[state.cur] === b.dataset.pick ? "" : b.dataset.pick; save("picked", state.picked);
      sync("picks", { day: state.cur, exercise: state.picked[state.cur] || "" }); render(); }); });
    dev.querySelectorAll("[data-fb]").forEach(function (b) { b.addEventListener("click", function () {
      var id = fbid(b.dataset.fb), v = b.dataset.val;
      state.fb[id] = state.fb[id] === v ? "" : v; save("fb", state.fb);
      sync("feedback", { day: state.cur, item: b.dataset.fb, value: state.fb[id] || "" });
      dev.querySelectorAll('[data-fb="' + b.dataset.fb + '"]').forEach(function (x) { x.setAttribute("aria-pressed", String(state.fb[id] === x.dataset.val)); });
    }); });
    dev.querySelectorAll("[data-note]").forEach(function (b) { b.addEventListener("click", function () {
      var k = fbid(b.dataset.note); state.noteOpen = state.noteOpen === k ? null : k; render();
      var ta = document.getElementById("note-" + b.dataset.note); if (ta) ta.focus(); }); });
    dev.querySelectorAll("textarea.grow").forEach(function (ta) {
      function fit() { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; }
      ta.addEventListener("input", fit); fit(); });
    dev.querySelectorAll("[data-note-save]").forEach(function (b) { b.addEventListener("click", function () {
      var id = b.dataset.noteSave, body = document.getElementById("note-" + id).value.trim(), st = document.getElementById("note-st-" + id);
      state.notes[fbid(id)] = body; save("notes", state.notes);
      var nb = dev.querySelector('[data-note="' + id + '"]'); if (nb) nb.setAttribute("aria-pressed", String(!!body));
      if (!body) { st.textContent = ""; return; }
      sync("notes", { day: state.cur, item: id, body: body }).then(function (ok) { st.textContent = ok ? u("note_saved") : u("note_local"); }); }); });
    var sv = document.getElementById("saveRecap");
    if (sv) sv.addEventListener("click", function () {
      var body = document.getElementById("recapBox").value, note = document.getElementById("savedNote");
      var r = load("recaps", {}); r[state.cur] = body; save("recaps", r);
      sync("recaps", { day: state.cur, body: body }).then(function (ok) { note.textContent = ok ? u("saved") : u("savedLocal"); note.hidden = false; });
    });
    var cb = document.getElementById("conn");
    if (cb) cb.addEventListener("click", function () { var v = document.getElementById("wk").value.trim(); if (v) { save("wkey", v); render(); } });
    var db = document.getElementById("disc");
    if (db) db.addEventListener("click", function () { save("wkey", ""); render(); });
    dev.querySelectorAll("[data-r]").forEach(function (b) {
      function open() { location.hash = "radar/" + b.dataset.r; }
      b.addEventListener("click", open);
      b.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    });
    dev.querySelectorAll("[data-rclose]").forEach(function (b) { b.addEventListener("click", function () { location.hash = "radar"; }); });
    dev.querySelectorAll("[data-ronly]").forEach(function (b) { b.addEventListener("click", function () { state.ronly = b.dataset.ronly === "1"; render(); }); });
    var rb = document.getElementById("recapBox");
    if (rb) rb.value = load("recaps", {})[state.cur] || "";
  }

  function route() {
    var h = location.hash.replace("#", "");
    state.menu = false;
    if (/^\d{4}-\d{2}-\d{2}$/.test(h)) {
      if (state.cur !== h) { state.cur = h; state.ed = null; state.err = false; state.slide = 0; render(); }
      fetch("editions/data/" + h + ".json", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (E) { if (state.cur === h) { state.ed = E; render(); if (E.type === "weekly" && !state.radar) loadRadar(); } })
        .catch(function () { if (state.cur === h) { state.err = true; render(); } });
    } else if (h === "radar" || h.indexOf("radar/") === 0) {
      var sel = h.slice(6) || null, was = state.cur === "radar";
      state.rsel = sel;
      if (!was) { state.cur = "radar"; state.ed = null; state.err = false; }
      render();
      if (!state.radar) loadRadar();
    } else { state.cur = null; render(); }
  }
  function loadRadar() {
    return fetch("radar.json", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (R) { state.radar = R; if (state.cur === "radar" || (state.ed && state.ed.type === "weekly")) render(); })
      .catch(function () { if (state.cur === "radar") { state.err = true; render(); } });
  }

  var lastWeb = isWeb();
  window.addEventListener("resize", function () { if (isWeb() !== lastWeb) { lastWeb = isWeb(); render(); } });
  window.addEventListener("hashchange", route);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && state.cur === "radar" && state.rsel) location.hash = "radar"; });
  fetch("editions/index.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : { editions: [] }; })
    .catch(function () { return { editions: [] }; })
    .then(function (idx) {
      state.days = idx.editions || []; state.loaded = true;
      return fetch("latest.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    })
    .then(function (lt) { state.latest = lt; route(); });
})();
</script>
</body>
</html>
